schema: turtbo-agent/ducted-fan-requirements@1
case_id: DF90-001
created: 2026-09-17T15:30:00+08:00
created_by: agent+user
revision_note: 首版需求基线；由 G0 问答第 1-6 项确认，其余项标 assumed 或 open

thrust:
  value: 90.0
  unit: kgf
  value_n: 882.60              # 90.0 x 9.80665
  condition: static            # V_inf = 0
  definition: control_volume   # 见 C-004；不得用 XMF 壁面轴向力
  source: user
  user_statement: "做一个需求为 90kg 推力的涵道风扇设计"

environment:
  p_inf_pa: 101325.0
  t_inf_k: 288.15
  v_inf_m_s: 0.0
  density_kg_m3: 1.225
  gas: dry_air
  gamma: 1.4
  cp_j_kg_k: 1006.0
  source: assumed
  assumption_note: "用户未指定环境；按 ISA 海平面标准大气假设，需用户在 G2 前确认"

geometry:
  tip_diameter_m: 0.600
  tip_radius_m: 0.300
  disk_area_m2: 0.282743
  constraint: locked
  source: user
  user_statement: "锁 0.6 m，承袭 v7 机匣"
  heritage: "Ducted-Fan/run/90kg-duct-fan-v7 机匣半径 0.300 m；PPT 指导页机匣直径 0.600 m"

shaft:
  rpm_design: 6100.0
  rpm_max_allowed: 8000.0
  rpm_constraint_source: motor
  tip_mach_design: 0.563        # 6100 rpm, R=0.3, a=340.3
  tip_mach_limit: null
  tip_mach_limit_source: open
  source: derived
  heritage: "v7 设计转速 6100 rpm；fine-v2-scan-plan.inc reference.speedRpm=6100"

motor:
  model: EMRAX 188
  datasheet: "Ducted-Fan/docx/EMRAX_188_datasheet_v1.6_translated.pdf"
  cooling_variant: CC            # 综合冷却（空气+液体），连续包线取最优
  peak_power_w: 60000.0          # S2, 2 min, @6500 rpm
  peak_torque_nm: 100.0
  continuous_power_w: 37000.0    # S1, CC 冷却
  continuous_torque_nm: 56.0     # CC 冷却
  max_speed_rpm: 8000.0
  peak_efficiency: 0.96
  pole_pairs: 10
  rotor_inertia_kg_m2: 0.00989
  mass_kg: 7.1
  # 电机包络 —— **2026-09-19 补**。
  # 为什么现在才补：v8 的轮毂型线在 P4..P5 之间保持 Ø188 平段，
  # 轴向长 83.955 mm（= 79 mm 电机 + 4.96 mm 余量），这是**人工在几何端满足的**。
  # 但需求里当时只有 `model: EMRAX 188`，没写外径和轴向长度 ——
  # G1/G2 因此推不出轮毂最小直径，只能在 G3 手工调。
  # 结果就是 G3-9 判 FAIL：几何证明不了由参数表导出。
  # 正确的修法不是禁止手工调整，而是把约束补进需求。
  outer_diameter_m: 0.188          # 数据表首行「直径 188 mm」= 外径
  axial_length_m: 0.079            # 数据表首行「长度 79 mm」
  axial_clearance_m: 0.00496       # 两端各留余量；取自 v8 实测 83.955 - 79 = 4.955 mm
  envelope_source: "EMRAX 188 datasheet 首行：直径 188 mm | 长度 79 mm"
  source: user

rows:
  count: 2
  configuration: rotor_stator
  source: user
  heritage: "v7 为转子+静子两排；PPT 指导为 R1/R2"

materials:
  blade: null
  duct: null
  source: open

manufacturing:
  min_le_radius_m: null
  min_chord_m: null
  process: null
  source: open

delivery:
  format: [xlsx, markdown, html]
  artifacts:
    - 性能参数表.xlsx
    - 叶片几何参数表.xlsx
    - 流道尺寸参数表.xlsx
    - 交付说明.md
    - dashboard.html
  source: user

acceptance:
  criteria:
    - id: ACC-1
      text: "整机静推力 T = mdot_out*Vx_out + (p_out - p_inf)*A_out 达到 882.60 N"
      method: control_volume
      source: user
    - id: ACC-2
      text: "末段 100 个有效迭代内 MF_IN、MF_OUT 各自 100*(max-min)/|mean| <= 0.2%"
      method: massflow_stability
      source: "C-002（项目工程合同，非通用判据）"
    - id: ACC-3
      text: "最终质量不平衡 <= 1%"
      method: mass_balance
      source: "C-002"
    - id: ACC-4
      text: "轴功率 <= EMRAX 188 连续功率 37 kW（持续工况）或 <= 峰值 60 kW（S2 <= 2 min）"
      method: motor_envelope
      source: user
  confirmed_by_user: true
  confirmed_at: 2026-09-17T15:30:00+08:00

verification_plan:
  first_point:
    rpm: 5000.0
    outlet_static_pressure_pa_abs: 101325.0
    reason: "v7 已验收锚点，可直接逐项对照：mdot ~13.499 kg/s, PR 1.0139, eta_tt 0.85193, rotor torque 34.507 N*m"
    source: user
  golden_baseline: "D:/Project/Research/Ducted-Fan/run/90kg-duct-fan-v7"
  replay_first: true
  source: user

open_questions:
  - "Q7 叶片与涵道材料未定（影响损失相关式与最小可制造厚度）"
  - "Q9 前尾缘最小半径、最小弦长未定（注塑件通常前缘半径 >= 0.3-0.5 mm）"
  - "桨尖马赫数上限未定；当前设计点 6100 rpm 为 0.563，8000 rpm 为 0.738"
  - "环境条件按 ISA 海平面假设，未经用户确认"
  - "涵道是否含扩张段/收缩段要求未确认"
  - "轴向总长约束未确认"
