<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>设计工作台 · 实时</title>
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --line:#2a323d;
  --fg:#e6edf3; --dim:#8b949e; --dim2:#6b7280;
  --ok:#3fb950; --run:#58a6ff; --wait:#6b7280; --bad:#f85149; --warn:#d29922;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
a{color:var(--run)}
h1{font-size:19px;margin:0 0 2px;font-weight:650}
.sub{color:var(--dim);font-size:12.5px}
.row{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-top:14px}
.card h2{font-size:13px;margin:0 0 12px;color:var(--dim);font-weight:600;letter-spacing:.04em}
.dot{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:7px;vertical-align:1px}
.dot.live{background:var(--ok);animation:pulse 1.6s infinite}
.dot.dead{background:var(--bad)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.tl{display:flex;gap:8px;flex-wrap:wrap}
.st{flex:1 1 132px;border:1px solid var(--line);border-radius:8px;padding:11px 13px;background:var(--panel2);position:relative}
.st .g{font-size:11px;color:var(--dim2);font-weight:700;letter-spacing:.06em}
.st .n{font-size:13.5px;margin-top:3px}
.st .s{font-size:11px;margin-top:9px;display:inline-block;padding:1px 8px;border-radius:99px}
.st.done{border-color:#1f6f34}.st.done .s{background:#12331d;color:#4ac26b}
.st.run{border-color:#1f4f86;box-shadow:0 0 0 1px #1f4f86}
.st.run .s{background:#12273f;color:#79c0ff}
.st.blocked{border-color:#7d2b26}.st.blocked .s{background:#3a1614;color:#ff7b72}
.st.pending .s{background:#20262e;color:#7d8590}
.st .arrow{position:absolute;right:-7px;top:50%;color:var(--line);font-size:14px;transform:translateY(-50%)}
.now{font-size:16px;font-weight:600;margin-bottom:4px}
.nowsub{color:var(--dim);font-size:12.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:12.5px;margin-top:12px;
    border-top:1px solid var(--line);padding-top:12px}
.kv dt{color:var(--dim2)}
.kv dd{margin:0;font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all}
pre{background:#0a0d11;border:1px solid var(--line);border-radius:8px;padding:13px;
    font:12px/1.65 ui-monospace,Consolas,monospace;max-height:260px;overflow:auto;margin:0;color:#c9d1d9}
.placeholder{color:var(--dim2);font-size:12.5px;font-style:normal}
.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;background:#20262e;color:var(--dim);border:1px solid var(--line)}
.clock{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--dim)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.err{background:#2d1418;border-color:#7d2b26;color:#ffa198}
</style>
</head>
<body>
<div class="wrap">

  <div class="row">
    <div>
      <h1 id="title">载入中…</h1>
      <div class="sub" id="reqline">正在连接本地服务</div>
    </div>
    <div style="text-align:right">
      <div class="clock"><span id="livedot" class="dot dead"></span><span id="livetxt">等待连接</span></div>
      <div class="clock" id="clock"></div>
    </div>
  </div>

  <div class="card" id="errcard" style="display:none">
    <h2>服务异常</h2><div id="errmsg" class="err" style="padding:10px;border-radius:8px"></div>
  </div>

  <div class="card">
    <h2>阶段时间线（G0 → G6）</h2>
    <div class="tl" id="timeline"></div>
  </div>

  <div class="card">
    <h2>现在在做什么</h2>
    <div class="now" id="nowline">—</div>
    <div class="nowsub" id="nowsub"></div>
    <dl class="kv" id="nowkv"></dl>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>正在运行的进程</h2>
      <div id="procs" class="placeholder">—</div>
    </div>
    <div class="card">
      <h2>最近改动的文件</h2>
      <div id="recent" class="placeholder">—</div>
    </div>
  </div>

  <div class="card">
    <h2>工程日志（尾部，自动刷新）</h2>
    <pre id="log">—</pre>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>版本沉淀</h2>
      <div id="versions" class="placeholder">待补：按 vN 列出每个阶段的产物与体积</div>
    </div>
    <div class="card">
      <h2>对标数字</h2>
      <div id="metrics" class="placeholder">待补：效率 / 功率 / 推力 目标 vs 实测</div>
    </div>
  </div>

  <div class="card">
    <h2>这些规矩是啥（白话）</h2>
    <div id="rules" class="placeholder">待补：C-001…C-011 的白话解释与来历</div>
  </div>

</div>

<script>
var lastOk = 0;

function el(id){ return document.getElementById(id); }

function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function fmtAge(sec){
  if (sec === null || sec === undefined) return "—";
  if (sec < 60) return Math.round(sec) + " 秒前";
  if (sec < 3600) return Math.round(sec/60) + " 分钟前";
  if (sec < 86400) return (sec/3600).toFixed(1) + " 小时前";
  return (sec/86400).toFixed(1) + " 天前";
}

function shortPath(p){
  if (!p) return "";
  var s = String(p).replace(/\\/g, "/");
  var parts = s.split("/");
  if (parts.length <= 2) return s;
  return "…/" + parts.slice(parts.length - 2).join("/");
}

function fmtBytes(n){
  if (n === null || n === undefined) return "—";
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n/1024).toFixed(1) + " KB";
  if (n < 1073741824) return (n/1048576).toFixed(1) + " MB";
  return (n/1073741824).toFixed(2) + " GB";
}

var STAGE_TITLE = {G0:"需求",G1:"设计大纲",G2:"1D 通流方案",G3:"叶片造型",G4:"网格",G5:"求解",G6:"后处理与交付"};
var STAGE_CLASS = {done:"done", in_progress:"run", blocked:"blocked", pending:"pending"};
var STAGE_TEXT  = {done:"已完成", in_progress:"进行中", blocked:"阻塞", pending:"未开始"};

function renderTimeline(stages, current){
  var order = ["G0","G1","G2","G3","G4","G5","G6"];
  var html = "";
  for (var i=0;i<order.length;i++){
    var g = order[i];
    var st = (stages && stages[g]) ? stages[g] : {};
    var status = st.status || "pending";
    var cls = STAGE_CLASS[status] || "pending";
    var txt = STAGE_TEXT[status] || status;
    html += '<div class="st ' + cls + '">'
         +  '<div class="g">' + g + '</div>'
         +  '<div class="n">' + esc(STAGE_TITLE[g]) + '</div>'
         +  '<span class="s">' + esc(txt) + '</span>'
         +  (i < order.length-1 ? '<span class="arrow">›</span>' : '')
         +  '</div>';
  }
  el("timeline").innerHTML = html;
}

function renderKV(pairs){
  var html = "";
  for (var i=0;i<pairs.length;i++){
    if (pairs[i][1] === null || pairs[i][1] === undefined || pairs[i][1] === "") continue;
    html += "<dt>" + esc(pairs[i][0]) + "</dt><dd>" + esc(pairs[i][1]) + "</dd>";
  }
  el("nowkv").innerHTML = html || '<dt>—</dt><dd></dd>';
}

function renderProcs(list){
  if (!list || !list.length){ el("procs").innerHTML = '<span class="placeholder">当前没有检测到 NUMECA / 求解相关进程</span>'; return; }
  var html = "";
  for (var i=0;i<list.length;i++){
    html += '<div style="font-family:ui-monospace,Consolas,monospace;font-size:12px;padding:3px 0">'
         +  '<span class="dot live"></span>' + esc(list[i].name) + ' <span style="color:var(--dim2)">pid ' + esc(list[i].pid) + '</span></div>';
  }
  el("procs").innerHTML = html;
}

function renderRecent(list){
  if (!list || !list.length){ el("recent").innerHTML = '<span class="placeholder">—</span>'; return; }
  var html = "";
  for (var i=0;i<list.length;i++){
    var f = list[i];
    html += '<div style="padding:3px 0;font-size:12px">'
         +  '<span style="color:var(--dim2);font-family:ui-monospace,Consolas,monospace">'
         +  esc(fmtAge(f.age_sec)) + '</span>&nbsp;&nbsp;'
         +  '<span style="font-family:ui-monospace,Consolas,monospace" title="' + esc(f.path) + '">' + esc(shortPath(f.path)) + '</span>'
         +  ' <span style="color:var(--dim2)">' + esc(fmtBytes(f.bytes)) + '</span></div>';
  }
  el("recent").innerHTML = html;
}

function apply(s){
  el("errcard").style.display = "none";
  var live = el("livedot"); live.className = "dot live";
  el("livetxt").textContent = "实时连接中";
  lastOk = Date.now();

  el("title").textContent = (s.case_id || "未命名案例") + " · 涵道风扇气动设计";
  el("reqline").textContent = s.requirement_line || "";
  el("clock").textContent = "服务器时间 " + (s.server_time || "");

  renderTimeline(s.stages, s.current_stage);

  el("nowline").textContent = s.activity || "—";
  el("nowsub").textContent = s.activity_detail || "";

  renderKV([
    ["当前阶段", s.current_stage],
    ["manifest 版本", s.revision],
    ["产物数量", s.artifact_count],
    ["最近一次改动", s.newest ? (shortPath(s.newest.path) + "　" + fmtAge(s.newest.age_sec)) : null],
    ["日志最后更新", s.log_age_sec === null || s.log_age_sec === undefined ? null : fmtAge(s.log_age_sec)]
  ]);

  renderProcs(s.processes);
  renderRecent(s.recent_files);

  var logEl = el("log");
  var lines = String(s.log_tail || "（暂无日志）").split("\n");
  if (lines.length > 70) lines = lines.slice(lines.length - 70);
  logEl.textContent = lines.join("\n");
  logEl.scrollTop = logEl.scrollHeight;   // 关键：显示最新，不是开头
}

function fail(msg){
  el("livetxt").textContent = "连接中断";
  el("livedot").className = "dot dead";
  el("errcard").style.display = "block";
  el("errmsg").textContent = msg;
}

function tick(){
  fetch("/api/state", {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(apply)
    .catch(function(e){ fail(String(e)); });
}

tick();
setInterval(tick, 1500);

setInterval(function(){
  if (lastOk && Date.now() - lastOk > 6000){
    el("livedot").className = "dot dead";
    el("livetxt").textContent = "数据已停止更新";
  }
}, 1000);
</script>
</body>
</html>
