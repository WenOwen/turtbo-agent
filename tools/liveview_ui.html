<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>设计工作台 · 实时</title>
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --line:#2a323d;
  --fg:#e6edf3; --dim:#8b949e; --dim2:#6b7280;
  --ok:#3fb950; --run:#58a6ff; --wait:#6b7280; --bad:#f85149; --warn:#d29922;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
a{color:var(--run)}
h1{font-size:19px;margin:0 0 2px;font-weight:650}
.sub{color:var(--dim);font-size:12.5px}
.row{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-top:14px}
.card h2{font-size:13px;margin:0 0 12px;color:var(--dim);font-weight:600;letter-spacing:.04em}
.dot{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:7px;vertical-align:1px}
.dot.live{background:var(--ok);animation:pulse 1.6s infinite}
.dot.dead{background:var(--bad)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.tl{display:flex;gap:8px;flex-wrap:wrap}
.st{flex:1 1 132px;border:1px solid var(--line);border-radius:8px;padding:11px 13px;background:var(--panel2);position:relative}
.st .g{font-size:11px;color:var(--dim2);font-weight:700;letter-spacing:.06em}
.st .n{font-size:13.5px;margin-top:3px}
.st .s{font-size:11px;margin-top:9px;display:inline-block;padding:1px 8px;border-radius:99px}
.st.done{border-color:#1f6f34}.st.done .s{background:#12331d;color:#4ac26b}
.st.run{border-color:#1f4f86;box-shadow:0 0 0 1px #1f4f86}
.st.run .s{background:#12273f;color:#79c0ff}
.st.blocked{border-color:#7d2b26}.st.blocked .s{background:#3a1614;color:#ff7b72}
.st.pending .s{background:#20262e;color:#7d8590}
.st .arrow{position:absolute;right:-7px;top:50%;color:var(--line);font-size:14px;transform:translateY(-50%)}
.now{font-size:16px;font-weight:600;margin-bottom:4px}
.nowsub{color:var(--dim);font-size:12.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:12.5px;margin-top:12px;
    border-top:1px solid var(--line);padding-top:12px}
.kv dt{color:var(--dim2)}
.kv dd{margin:0;font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all}
pre{background:#0a0d11;border:1px solid var(--line);border-radius:8px;padding:13px;
    font:12px/1.65 ui-monospace,Consolas,monospace;max-height:260px;overflow:auto;margin:0;color:#c9d1d9}
.placeholder{color:var(--dim2);font-size:12.5px;font-style:normal}
.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;background:#20262e;color:var(--dim);border:1px solid var(--line)}
.clock{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--dim)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.err{background:#2d1418;border-color:#7d2b26;color:#ffa198}
.rule{border:1px solid var(--line);border-radius:8px;background:var(--panel2);margin-bottom:7px;overflow:hidden}
.rule>summary{cursor:pointer;padding:10px 13px;display:flex;gap:11px;align-items:baseline;list-style:none}
.rule>summary::-webkit-details-marker{display:none}
.rule>summary::before{content:"▸";color:var(--dim2);font-size:11px;transition:transform .15s}
.rule[open]>summary::before{transform:rotate(90deg)}
.rule .rid{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:#79c0ff;
  background:#12273f;padding:1px 7px;border-radius:5px;flex:none}
.rule .rtitle{font-size:13px}
.rule[open]>summary{background:#1a212b}
.rbody{padding:2px 15px 14px 33px;border-top:1px solid var(--line)}
.rplain{font-size:13.5px;line-height:1.75;margin:12px 0 0;color:#dbe4ee}
.rwhy{font-size:12.5px;line-height:1.7;color:var(--dim);margin-top:9px;
  border-left:2px solid #3d4753;padding-left:11px}
.rwhy b{color:var(--warn);font-weight:600}
.rsrc{font-size:11.5px;color:var(--dim2);margin-top:8px;font-family:ui-monospace,Consolas,monospace}
.casesel{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:7px;
  padding:6px 11px;font-size:13px;font-family:inherit;cursor:pointer;min-width:210px}
.casesel:focus{outline:none;border-color:var(--run)}
.st{cursor:pointer;transition:border-color .12s,box-shadow .12s}
.st:hover{border-color:#3d4753}
.st.sel{border-color:var(--run);box-shadow:0 0 0 2px rgba(88,166,255,.22)}
.st.sel .g::after{content:" · 已选中";color:var(--run);font-weight:400}
.sdlabel{font-size:12px;color:var(--dim2);margin:16px 0 8px;font-weight:600}
.sdlabel:first-child{margin-top:0}
.logent{border-left:2px solid #3d4753;padding:9px 0 9px 13px;margin-bottom:10px}
.logent.pass{border-left-color:#238636}
.logent.warn{border-left-color:#9e6a03}
.logent.fail{border-left-color:#a32020}
.lehead{display:flex;gap:10px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.lets{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--dim2)}
.leact{font-size:13px}
.lefields{display:grid;grid-template-columns:78px 1fr;gap:3px 12px;font-size:12px;margin:0}
.lefields dt{color:var(--dim2)}
.lefields dd{margin:0;color:#c9d1d9;word-break:break-word}
.hint{font-size:12px;color:var(--dim2);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">

  <div class="row">
    <div>
      <h1 id="title">载入中…</h1>
      <div class="sub" id="reqline">正在连接本地服务</div>
    </div>
    <div style="text-align:right">
      <div style="margin-bottom:7px">
        <select id="casesel" class="casesel" onchange="selectCase(this.value)"></select>
      </div>
      <div class="clock"><span id="livedot" class="dot dead"></span><span id="livetxt">等待连接</span></div>
      <div class="clock" id="clock"></div>
    </div>
  </div>

  <div class="card" id="errcard" style="display:none">
    <h2>服务异常</h2><div id="errmsg" class="err" style="padding:10px;border-radius:8px"></div>
  </div>

  <div class="card">
    <h2>阶段时间线（G0 → G6）· 点任意一格看该阶段的产物与过程记录</h2>
    <div class="tl" id="timeline"></div>
  </div>

  <div id="stagedetail"></div>

  <div class="card">
    <h2>现在在做什么</h2>
    <div class="now" id="nowline">—</div>
    <div class="nowsub" id="nowsub"></div>
    <dl class="kv" id="nowkv"></dl>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>正在运行的进程</h2>
      <div id="procs" class="placeholder">—</div>
    </div>
    <div class="card">
      <h2>最近改动的文件</h2>
      <div id="recent" class="placeholder">—</div>
    </div>
  </div>

  <div class="card">
    <h2>工程日志（尾部，自动刷新）</h2>
    <pre id="log">—</pre>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>版本沉淀</h2>
      <div id="versions" class="placeholder">待补：按 vN 列出每个阶段的产物与体积</div>
    </div>
    <div class="card">
      <h2>对标数字</h2>
      <div id="metrics" class="placeholder">待补：效率 / 功率 / 推力 目标 vs 实测</div>
    </div>
  </div>

  <div class="card">
    <h2>这些规矩是啥（白话）· <span id="rulecount" style="color:var(--dim2)"></span></h2>
    <div id="rules" class="placeholder">载入中…</div>
  </div>

</div>

<script>
var lastOk = 0;
var currentCase = null;
var selectedStage = null;
var lastData = null;

function el(id){ return document.getElementById(id); }

// 只有内容真的变了才写 DOM。否则每 1.5 秒重建一次 innerHTML 会把
// details 的展开状态、用户的文本选择、滚动位置全部抹掉。
function setHTML(id, html){
  var n = el(id);
  if (n.__sig === html) return;
  n.__sig = html;
  n.innerHTML = html;
}

function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function fmtAge(sec){
  if (sec === null || sec === undefined) return "—";
  if (sec < 60) return Math.round(sec) + " 秒前";
  if (sec < 3600) return Math.round(sec/60) + " 分钟前";
  if (sec < 86400) return (sec/3600).toFixed(1) + " 小时前";
  return (sec/86400).toFixed(1) + " 天前";
}

function shortPath(p){
  if (!p) return "";
  var s = String(p).replace(/\\/g, "/");
  var parts = s.split("/");
  if (parts.length <= 2) return s;
  return "…/" + parts.slice(parts.length - 2).join("/");
}

function fmtBytes(n){
  if (n === null || n === undefined) return "—";
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n/1024).toFixed(1) + " KB";
  if (n < 1073741824) return (n/1048576).toFixed(1) + " MB";
  return (n/1073741824).toFixed(2) + " GB";
}

var STAGE_TITLE = {G0:"需求",G1:"设计大纲",G2:"1D 通流方案",G3:"叶片造型",G4:"网格",G5:"求解",G6:"后处理与交付"};
var STAGE_CLASS = {done:"done", in_progress:"run", blocked:"blocked", pending:"pending"};
var STAGE_TEXT  = {done:"已完成", in_progress:"进行中", blocked:"阻塞", pending:"未开始"};

var STAGE_ORDER = ["G0","G1","G2","G3","G4","G5","G6"];

function renderTimeline(stages, current){
  var html = "";
  for (var i=0;i<STAGE_ORDER.length;i++){
    var g = STAGE_ORDER[i];
    var st = (stages && stages[g]) ? stages[g] : {};
    var status = st.status || "pending";
    var cls = STAGE_CLASS[status] || "pending";
    var txt = STAGE_TEXT[status] || status;
    html += '<div class="st ' + cls + (g === selectedStage ? ' sel' : '') + '"'
         +  ' onclick="selectStage(&quot;' + g + '&quot;)" title="点击查看该阶段的产物与过程记录">'
         +  '<div class="g">' + g + '</div>'
         +  '<div class="n">' + esc(STAGE_TITLE[g]) + '</div>'
         +  '<span class="s">' + esc(txt) + '</span>'
         +  (i < STAGE_ORDER.length-1 ? '<span class="arrow">›</span>' : '')
         +  '</div>';
  }
  setHTML("timeline", html);
}

function vcls(v){
  v = String(v || "INFO").toUpperCase();
  if (v === "PASS") return "pass";
  if (v === "FAIL" || v === "BLOCKED") return "fail";
  if (v === "WARN") return "warn";
  return "";
}

function renderStageDetail(detail, sel){
  var d = detail && detail[sel];
  if (!d){ setHTML("stagedetail", ""); return; }
  var h = '<div class="card">'
        + '<h2>阶段 ' + esc(d.id) + ' ' + esc(d.name) + ' · '
        + esc(STAGE_TEXT[d.status] || d.status)
        + (d.updated ? ' · 更新于 ' + esc(d.updated) : '') + '</h2>';

  h += '<div class="sdlabel">产物（' + d.artifacts.length + '）</div>';
  if (d.artifacts.length){
    h += '<table><thead><tr><th>结论</th><th>版本</th><th>路径</th><th>体积</th>'
       + '<th>sha256</th><th>上游</th></tr></thead><tbody>';
    for (var i=0;i<d.artifacts.length;i++){
      var a = d.artifacts[i];
      h += '<tr><td><span class="v v-' + esc(a.verdict) + '">' + esc(a.verdict) + '</span></td>'
         + '<td class="mono">' + esc(a.version) + '</td>'
         + '<td class="mono" title="' + esc(a.path) + '">' + esc(a.path) + '</td>'
         + '<td class="mono">' + esc(fmtBytes(a.bytes)) + '</td>'
         + '<td class="mono">' + esc(a.sha256) + '</td>'
         + '<td class="mono">' + esc(a.from || "—") + '</td></tr>';
      if (a.note){
        h += '<tr><td></td><td colspan="5" style="color:var(--dim);font-size:12px">备注：'
           + esc(a.note) + '</td></tr>';
      }
    }
    h += '</tbody></table>';
  } else {
    h += '<div class="placeholder">该阶段暂无登记产物</div>';
  }

  h += '<div class="sdlabel">过程记录（' + d.log.length + ' 条）</div>';
  if (d.log.length){
    for (var j=0;j<d.log.length;j++){
      var e = d.log[j];
      var act = "";
      var fields = "";
      for (var k=0;k<e.fields.length;k++){
        var f = e.fields[k];
        if (f.k === "动作"){ act = f.v; continue; }
        fields += '<dt>' + esc(f.k) + '</dt><dd>' + esc(f.v) + '</dd>';
      }
      h += '<div class="logent ' + vcls(e.verdict) + '">'
         + '<div class="lehead"><span class="lets">' + esc(e.ts) + '</span>'
         + '<span class="v v-' + esc(e.verdict) + '">' + esc(e.verdict) + '</span>'
         + '<span class="leact">' + esc(act) + '</span></div>'
         + (fields ? '<dl class="lefields">' + fields + '</dl>' : '')
         + '</div>';
    }
  } else {
    h += '<div class="placeholder">该阶段暂无过程记录</div>';
  }

  h += '<div class="hint">提示：日志为只追加，这里是该阶段的全部历史条目。</div></div>';
  setHTML("stagedetail", h);
}

function selectStage(g){
  selectedStage = g;
  if (lastData) renderTimeline(lastData.stages, lastData.current_stage);
  if (lastData) renderStageDetail(lastData.stage_detail, selectedStage);
}

function selectCase(v){
  currentCase = v;
  selectedStage = null;
  tick();
}

function renderCaseSelector(list, active){
  if (!list || !list.length) return;
  var sig = list.map(function(c){ return c.id + c.revision; }).join("|") + "#" + active;
  var sel = el("casesel");
  if (sel.__sig === sig) return;
  sel.__sig = sig;
  var h = "";
  for (var i=0;i<list.length;i++){
    var c = list[i];
    var label = c.id + "　·　" + (c.current_stage || "—") + "　·　" + c.artifact_count + " 产物";
    h += '<option value="' + esc(c.id) + '"' + (c.id === active ? ' selected' : '') + '>'
       + esc(label) + '</option>';
  }
  sel.innerHTML = h;
}

function renderKV(pairs){
  var html = "";
  for (var i=0;i<pairs.length;i++){
    if (pairs[i][1] === null || pairs[i][1] === undefined || pairs[i][1] === "") continue;
    html += "<dt>" + esc(pairs[i][0]) + "</dt><dd>" + esc(pairs[i][1]) + "</dd>";
  }
  setHTML("nowkv", html || '<dt>—</dt><dd></dd>');
}

function renderProcs(list){
  if (!list || !list.length){ el("procs").innerHTML = '<span class="placeholder">当前没有检测到 NUMECA / 求解相关进程</span>'; return; }
  var html = "";
  for (var i=0;i<list.length;i++){
    html += '<div style="font-family:ui-monospace,Consolas,monospace;font-size:12px;padding:3px 0">'
         +  '<span class="dot live"></span>' + esc(list[i].name) + ' <span style="color:var(--dim2)">pid ' + esc(list[i].pid) + '</span></div>';
  }
  setHTML("procs", html);
}

function renderRecent(list){
  if (!list || !list.length){ el("recent").innerHTML = '<span class="placeholder">—</span>'; return; }
  var html = "";
  for (var i=0;i<list.length;i++){
    var f = list[i];
    html += '<div style="padding:3px 0;font-size:12px">'
         +  '<span style="color:var(--dim2);font-family:ui-monospace,Consolas,monospace">'
         +  esc(fmtAge(f.age_sec)) + '</span>&nbsp;&nbsp;'
         +  '<span style="font-family:ui-monospace,Consolas,monospace" title="' + esc(f.path) + '">' + esc(shortPath(f.path)) + '</span>'
         +  ' <span style="color:var(--dim2)">' + esc(fmtBytes(f.bytes)) + '</span></div>';
  }
  setHTML("recent", html);
}

function renderRules(list){
  if (!list || !list.length){
    el("rules").innerHTML = '<span class="placeholder">没有解析到合同条目</span>';
    el("rulecount").textContent = "";
    return;
  }
  var html = "";
  for (var i=0;i<list.length;i++){
    var r = list[i];
    html += '<details class="rule">'
         +  '<summary><span class="rid">' + esc(r.id) + '</span>'
         +  '<span class="rtitle">' + esc(r.title) + '</span></summary>'
         +  '<div class="rbody">'
         +  '<div class="rplain">' + esc(r.plain) + '</div>'
         +  (r.why ? '<div class="rwhy"><b>当初为什么加：</b>' + esc(r.why) + '</div>' : '')
         +  (r.source ? '<div class="rsrc">来源：' + esc(r.source) + '</div>' : '')
         +  '</div></details>';
  }
  setHTML("rules", html);
  el("rulecount").textContent = list.length + " 条";
}

function apply(s){
  el("errcard").style.display = "none";
  var live = el("livedot"); live.className = "dot live";
  el("livetxt").textContent = "实时连接中";
  lastOk = Date.now();

  lastData = s;
  currentCase = s.case_id || currentCase;

  el("title").textContent = (s.case_id || "未命名案例") + " · 涵道风扇气动设计";
  el("reqline").textContent = s.requirement_line || "";
  el("clock").textContent = "服务器时间 " + (s.server_time || "");

  renderCaseSelector(s.cases, s.case_id);

  // 首次载入时默认选中"正在进行的阶段"，没有就选最新阶段
  if (!selectedStage){
    var pick = null;
    for (var i=0;i<STAGE_ORDER.length;i++){
      var st = (s.stages || {})[STAGE_ORDER[i]];
      if (st && st.status === "in_progress"){ pick = STAGE_ORDER[i]; break; }
    }
    selectedStage = pick || s.current_stage || "G0";
  }

  renderTimeline(s.stages, s.current_stage);
  renderStageDetail(s.stage_detail, selectedStage);

  el("nowline").textContent = s.activity || "—";
  el("nowsub").textContent = s.activity_detail || "";

  renderKV([
    ["当前阶段", s.current_stage],
    ["manifest 版本", s.revision],
    ["产物数量", s.artifact_count],
    ["最近一次改动", s.newest ? (shortPath(s.newest.path) + "　" + fmtAge(s.newest.age_sec)) : null],
    ["日志最后更新", s.log_age_sec === null || s.log_age_sec === undefined ? null : fmtAge(s.log_age_sec)]
  ]);

  renderProcs(s.processes);
  renderRecent(s.recent_files);

  var logEl = el("log");
  var lines = String(s.log_tail || "（暂无日志）").split("\n");
  if (lines.length > 70) lines = lines.slice(lines.length - 70);
  var logText = lines.join("\n");
  if (logEl.textContent !== logText){
    // 用户已经往上翻看历史时，不要把他拽回底部
    var nearBottom = (logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight) < 48;
    var firstPaint = !logEl.__painted;
    logEl.textContent = logText;
    logEl.__painted = true;
    if (nearBottom || firstPaint) logEl.scrollTop = logEl.scrollHeight;
  }

  renderRules(s.rules);
}

function fail(msg){
  el("livetxt").textContent = "连接中断";
  el("livedot").className = "dot dead";
  el("errcard").style.display = "block";
  el("errmsg").textContent = msg;
}

function tick(){
  var url = "/api/state" + (currentCase ? ("?case=" + encodeURIComponent(currentCase)) : "");
  fetch(url, {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(apply)
    .catch(function(e){ fail(String(e)); });
}

tick();
setInterval(tick, 1500);

setInterval(function(){
  if (lastOk && Date.now() - lastOk > 6000){
    el("livedot").className = "dot dead";
    el("livetxt").textContent = "数据已停止更新";
  }
}, 1000);
</script>
</body>
</html>
